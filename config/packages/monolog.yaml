# Replaces Django's LOGGING config: logs/access.log and logs/error.log
monolog:
    channels: ['access', 'app_error']
    handlers:
        access:
            type: rotating_file
            path: '%kernel.logs_dir%/access.log'
            level: info
            max_files: 3
            channels: ['access']
            formatter: app.log_formatter
        app_error:
            type: rotating_file
            path: '%kernel.logs_dir%/error.log'
            level: error
            max_files: 3
            channels: ['app_error']
            formatter: app.log_formatter
        main:
            type: stream
            path: '%kernel.logs_dir%/%kernel.environment%.log'
            level: warning
            channels: ['!access', '!app_error', '!event', '!doctrine']
